name: Build, Sign and Deploy APT Repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install APT tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gpg

      - name: Import GPG Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPGPRIVATEKEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --armor --export "stupidestjack@users.noreply.github.com" > debian2windows.gpg.key

      - name: Generate Packages and Release files
        run: |
          dpkg-scanpackages --multiversion . /dev/null > Packages
          gzip -k -f Packages
          apt-ftparchive release . > Release

      - name: Sign Release files
        run: |
          gpg --batch --yes --default-key "stupidestjack@users.noreply.github.com" --clearsign -o InRelease Release
          gpg --batch --yes --default-key "stupidestjack@users.noreply.github.com" -abs -o Release.gpg Release

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz Release InRelease Release.gpg debian2windows.gpg.key
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: regenerate repo metadata and GPG signatures [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-sign
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
